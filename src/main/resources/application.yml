spring:
  application:
    name: ticketnest

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: logstash

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000  # 15 minutes (access token)
  booking:
    hold-duration: PT10M
    cleanup-interval: PT1M
    cleanup-batch-size: 100
  rate-limit:
    login:
      capacity: 5
      refill-period: PT1M
    booking-create:
      capacity: 10
      refill-period: PT1M
    cleanup-interval: PT1M
