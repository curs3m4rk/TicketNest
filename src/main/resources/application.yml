spring:
  application:
    name: ticketnest

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ticketnest?currentSchema=public&timezone=UTC}
    username: ${DB_USERNAME:ticketnest}
    password: ${DB_PASSWORD:ticketnest_Admin}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# SSL/HTTPS Configuration (development)
server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:true}
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: ticketnest

springdoc:
  swagger-ui:
    path: /swagger

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: logstash

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-here-make-it-long-and-random-for-production}
    expiration-ms: 900000  # 15 minutes (access token)
