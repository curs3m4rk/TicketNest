spring:
  application:
    name: ticketnest

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ticketnest?currentSchema=public&timezone=UTC}
    username: ${DB_USERNAME:ticketnest}
    password: ${DB_PASSWORD:ticketnest_Admin}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

# SSL/HTTPS Configuration (development)
server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:true}
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: ticketnest

springdoc:
  swagger-ui:
    path: /swagger

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: logstash

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-here-make-it-long-and-random-for-production}
    expiration-ms: 900000  # 15 minutes (access token)
  otp:
    secret: ${OTP_SECRET:development-only-change-this-otp-secret}
    ttl-seconds: ${OTP_TTL_SECONDS:300}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    max-requests-per-window: ${OTP_MAX_REQUESTS_PER_WINDOW:5}
    request-window-seconds: ${OTP_REQUEST_WINDOW_SECONDS:900}
    max-verification-attempts: ${OTP_MAX_VERIFICATION_ATTEMPTS:5}
    email:
      enabled: ${OTP_EMAIL_ENABLED:false}
      from: ${OTP_EMAIL_FROM:no-reply@ticketnest.local}
    sms:
      enabled: ${OTP_SMS_ENABLED:false}
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
