spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ticketnest?currentSchema=public&timezone=UTC
    username: ticketnest
    password: ticketnest_Admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# SSL/HTTPS Configuration (development)
server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: ticketnest

springdoc:
  swagger-ui:
    path: /swagger

app:
  jwt:
    secret: "your-256-bit-secret-key-here-make-it-long-and-random-for-production"
    expiration-ms: 900000  # 15 minutes (access token)