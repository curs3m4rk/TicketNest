name: CI/CD

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and package
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests
        run: ./mvnw --batch-mode --no-transfer-progress test
      - name: Upload unit-test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_id }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run PostgreSQL integration tests
        run: ./mvnw --batch-mode --no-transfer-progress verify -DskipUnitTests
      - name: Upload integration-test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-${{ github.run_id }}
          path: target/failsafe-reports/
          if-no-files-found: ignore

  deploy-azure-devtest:
    name: Deploy Azure DevTest
    if: github.ref == 'refs/heads/master'
    needs:
      - build-validation
      - unit-tests
      - integration-tests
    runs-on: ubuntu-latest
    environment: azure-devtest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: azure-devtest
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_CONTAINER_REGISTRY }}"

      - name: Build and push immutable image
        env:
          IMAGE: ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/ticketnest:${{ github.sha }}
        run: |
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy revision and run smoke checks
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
          IMAGE: ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/ticketnest:${{ github.sha }}
        run: |
          set -Eeuo pipefail

          previous_revision=$(az containerapp revision list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            --query "[?properties.active].name | [0]" \
            --output tsv)

          rollback() {
            if [ -n "$previous_revision" ]; then
              echo "Restoring revision $previous_revision"
              az containerapp revision activate \
                --resource-group "$RESOURCE_GROUP" \
                --name "$CONTAINER_APP" \
                --revision "$previous_revision"
            fi
          }
          trap rollback ERR

          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            --image "$IMAGE" \
            --output none

          new_revision=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            --query properties.latestRevisionName \
            --output tsv)

          revision_healthy=false
          for attempt in $(seq 1 30); do
            health_state=$(az containerapp revision show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP" \
              --revision "$new_revision" \
              --query properties.healthState \
              --output tsv 2>/dev/null || true)
            running_state=$(az containerapp revision show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP" \
              --revision "$new_revision" \
              --query properties.runningState \
              --output tsv 2>/dev/null || true)
            if [ "$health_state" = "Healthy" ] && [ "$running_state" = "Running" ]; then
              revision_healthy=true
              break
            fi
            sleep 10
          done
          [ "$revision_healthy" = true ]

          fqdn=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          base_url="https://$fqdn"

          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "$base_url/actuator/health" | grep -q '"status":"UP"'

          for path in /swagger /swagger-ui/index.html /v3/api-docs; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$base_url$path")
            [ "$status" = "404" ]
          done

          trap - ERR
